<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" role="img" aria-labelledby="lovelTitle lovelDesc">
  <title id="lovelTitle">Lovel Digital</title>
  <desc id="lovelDesc">Logo Lovel Digital: globo verde com bolha de conversa e a inscrição Lovel Digital — Desde 2026.</desc>
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B6E86A"/>
      <stop offset="1" stop-color="#5CC46B"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BE8F5"/>
      <stop offset="1" stop-color="#2BA6C9"/>
    </linearGradient>
  </defs>

  <!-- Globo principal -->
  <circle cx="250" cy="185" r="150" fill="url(#gGreen)"/>

  <!-- Continentes (silhuetas) -->
  <path d="M140 120 C165 95 205 100 225 120 C245 140 240 165 220 180 C205 190 185 188 170 178 C160 172 150 174 140 165 C128 154 126 135 140 120 Z" fill="#0B2545"/>
  <path d="M185 215 C205 205 228 212 236 232 C244 252 238 280 222 300 C210 316 196 320 190 306 C184 292 190 270 184 252 C178 236 176 224 185 215 Z" fill="#0B2545"/>
  <path d="M285 175 C310 165 335 175 345 198 C355 222 348 252 325 265 C305 276 288 268 282 248 C276 228 278 205 285 175 Z" fill="#0B2545"/>

  <!-- Bolha de conversa -->
  <path d="M360 90 C360 60 390 40 425 40 L470 40 C505 40 535 62 535 92 L535 120 C535 150 505 170 470 170 L430 170 L400 205 L405 170 L390 168 C370 164 360 148 360 128 Z" fill="#0B2545"/>

  <!-- Globo menor dentro da bolha -->
  <circle cx="447" cy="105" r="48" fill="url(#gTeal)"/>
  <path d="M420 78 C432 68 450 70 458 82 C466 94 462 108 450 114 C440 119 430 116 424 108 C418 100 414 86 420 78 Z" fill="#0B2545"/>
  <path d="M462 118 C472 112 484 116 488 126 C492 138 486 150 474 152 C466 153 460 147 459 138 C458 130 458 122 462 118 Z" fill="#0B2545"/>

  <!-- Tipografia -->
  <text x="330" y="415" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="2" fill="#0B2545">LOVEL DIGITAL</text>
  <text x="330" y="462" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="11" fill="#0B2545">DESDE 2026</text>
</svg>
